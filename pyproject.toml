[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-network-automation"
version = "0.1.0"
description = "Network automation toolkit: YAML inventory, async SSH collection, config backup/diff, compliance policies, Linux host network health, and a C pcap parser."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tommy Shamamba" }]
dependencies = [
  "asyncssh>=2.17,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "dpkt>=1.9",
]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus = ["py.typed", "_lib/*.so"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101", "S603", "S607", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/nexus"]

[[tool.mypy.overrides]]
module = ["asyncssh.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: talks to the in-process fake SSH devices over real TCP"]
